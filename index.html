<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>Pantry Ledger</h1>
    <div class="topbar-actions">
      <button id="open-add-btn" class="btn btn-primary hidden">Add item</button>
      <button id="sign-out-btn" class="btn btn-ghost hidden">Sign out</button>
    </div>
  </header>

  <!-- Login screen -->
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="dialog login-form">
      <h2>Sign in</h2>
      <label>
        Email
        <input type="email" id="login-email" required autocomplete="username">
      </label>
      <label>
        Password
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
  </div>

  <main id="shelves-container" class="shelves hidden">
    <p class="empty-state">Loading your kitchen…</p>
  </main>

  <!-- Add / edit item panel -->
  <div id="item-dialog" class="dialog-backdrop hidden">
    <form id="item-form" class="dialog">
      <h2 id="dialog-title">Add item</h2>

      <label>
        Item name
        <input type="text" id="food-name" required placeholder="e.g. Basmati rice">
      </label>

      <label>
        Shelf
        <select id="shelf-select" required></select>
      </label>

      <div class="field-row">
        <label>
          Date purchased
          <input type="date" id="date-purchased">
        </label>
        <label>
          Expires
          <input type="date" id="expir-date">
        </label>
      </div>

      <input type="hidden" id="item-id">

      <div class="dialog-actions">
        <button type="button" id="cancel-btn" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save item</button>
      </div>
    </form>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
